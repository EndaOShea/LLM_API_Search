[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-api-search"
version = "0.1.0"
description = "Discover and connect to the latest LLM API versions (Claude, Gemini, OpenAI)"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["llm", "api", "anthropic", "claude", "gemini", "openai"]

[project.optional-dependencies]
anthropic = ["anthropic"]
google = ["google-genai"]
openai = ["openai"]
# mcp 2.0 removed mcp.server.fastmcp (breaking restructure) — pin below 2
# until mcp_servers/ is migrated to the 2.0 API.
mcp = ["mcp[cli]<2"]
test = ["pytest"]
all = ["anthropic", "google-genai", "openai", "mcp[cli]<2"]

[tool.setuptools.packages.find]
include = ["llm_api_search*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
